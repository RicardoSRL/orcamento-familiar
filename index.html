<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livro de Contas — Orçamento</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#22281F;--soft:#5B6152;--paper:#EFEBDE;--dark:#E4DEC9;--line:#D6CCAE;--acc:#2F6F4F;--brick:#B4533C;--amber:#C08A2E}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink)}
.serif{font-family:'Source Serif 4',Georgia,serif}.mono{font-family:'IBM Plex Mono',monospace}
#app{display:flex;height:100vh;overflow:hidden}
aside{width:210px;flex-shrink:0;background:var(--dark);border-right:1px solid var(--line);padding:20px;display:flex;flex-direction:column}
nav{margin-top:28px;display:flex;flex-direction:column;gap:4px}
button{font-family:inherit;cursor:pointer}
.nav-btn,.side-btn{padding:9px 12px;border-radius:6px;font-size:14px;background:transparent;border:none;color:var(--ink);text-align:left}
.nav-btn.active{background:var(--acc);color:#F5F2E7;font-weight:600}.nav-btn:not(.active):hover,.side-btn:hover{background:#DCD5BC}
.side{margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}.side-btn{width:100%}
main{flex:1;overflow-y:auto}.content{max-width:1080px;margin:0 auto;padding:32px 36px}
h1{font-size:25px;font-weight:600;margin:0}h2{font-size:15px;margin:30px 0 10px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.grp{display:flex;align-items:center;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}.seg button{padding:7px 14px;border:none;background:#fff;font-size:14px}.seg button.on{background:var(--acc);color:#fff}
.icon-btn{padding:6px 10px;border-radius:6px;background:transparent;border:none;color:var(--soft)}.icon-btn:hover{background:var(--dark)}.danger{color:var(--brick)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-bottom:22px}
.card{padding:13px 14px;border-radius:8px;background:var(--dark);border:1px solid var(--line)}.card.hl{background:var(--acc);border-color:var(--acc);color:#F5F2E7}
.lab{font-size:12px;color:var(--soft);margin-bottom:6px}.hl .lab{color:#DCEAE0}.val{font-size:18px;font-weight:600}
.pos{color:var(--acc)}.neg{color:var(--brick)}.hl .pos,.hl .neg{color:#fff}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:32px}@media(max-width:900px){.cols{grid-template-columns:1fr}aside{width:150px}}
.dot{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:6px}
.leg{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.btn{padding:8px 13px;border-radius:6px;font-size:14px;background:var(--acc);color:#F5F2E7;border:none}
select,input{font-size:14px;padding:6px 9px;border-radius:6px;border:1px solid var(--line);background:#fff;font-family:inherit;color:var(--ink)}
table{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:8px;overflow:hidden}
th{background:var(--dark);color:var(--soft);font-size:12px;font-weight:600;text-align:left;padding:8px 10px}
td{padding:5px 10px;border-top:1px solid var(--line);background:#fff;font-size:13.5px;vertical-align:middle}
td input:not([type=checkbox]),td select{border:none;background:transparent;width:100%;padding:2px 0}td input:focus{outline:1px solid var(--acc)}
tr.today td{background:#F6F0D6}tr.late td{color:var(--brick)}
.empty{padding:26px;text-align:center;font-size:14px;color:var(--soft);border:1px dashed var(--line);border-radius:6px}
.hint{font-size:12.5px;color:var(--soft)}.bud{padding:14px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:14px}
.mo{display:flex;gap:2px}.mo label{font-size:11px;text-align:center;color:var(--soft)}.mo input{display:block;margin:0 auto}
.banner{position:fixed;bottom:22px;right:22px;padding:11px 15px;border-radius:8px;color:#F5F2E7;z-index:9}
.hidden{display:none}
</style></head><body><div id="app"></div>
<script>
const pad=n=>String(n).padStart(2,"0"),mk=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`,CUR=mk(new Date());
const eur=v=>new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR"}).format(Number(v)||0);
const mlabel=k=>{const[y,m]=k.split("-");const s=new Intl.DateTimeFormat("pt-PT",{month:"long",year:"numeric"}).format(new Date(y,m-1,1));return s[0].toUpperCase()+s.slice(1)};
const addM=(k,d)=>{const[y,m]=k.split("-").map(Number);return mk(new Date(y,m-1+d,1))};
const dim=k=>{const[y,m]=k.split("-").map(Number);return new Date(y,m,0).getDate()};
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sum=a=>a.reduce((s,x)=>s+(+x.amount||0),0);
const NOC={id:"sem-categoria",name:"Sem categoria",color:"#9A9484"},SP=[["familia","Família"],["trabalho","Trabalho"]],MI="JFMAMJJASOND";
let D={categories:[],items:[],entries:[],months:{},settings:{reserveDay:{familia:5,trabalho:5}}};
let U={page:"overview",month:CUR,space:"familia",scope:"fwd",banner:null};
const cat=id=>D.categories.find(c=>c.id===id)||NOC;
const M=m=>D.months[m]||{income:[],paid:{},reserve:{},ov:{}};
const MM=m=>D.months[m]||(D.months[m]={income:[],paid:{},reserve:{},ov:{}});
const bud=(sp,id)=>0;
function R0(it,m){let v=null;for(const x of it.versions)if(x.from<=m&&(!v||x.from>=v.from))v=x;return v&&!v.end?v:null}
function R(it,m){const v=R0(it,m);return v&&{...v,...((M(m).ov||{})[it.id]||{})}}
function occ(it,r,m){const n=dim(m),o=[],mkO=d=>({day:d,date:`${m}-${pad(d)}`,key:`${it.id}@${m}-${pad(d)}`});
 if(r.freq==="biweekly"){const ref=Date.parse(r.ref+"T00:00:00Z");for(let d=1;d<=n;d++){const k=Math.round((Date.parse(`${m}-${pad(d)}T00:00:00Z`)-ref)/864e5);if(((k%14)+14)%14===0)o.push(mkO(d))}}
 else o.push(mkO(Math.min(n,r.day>0?r.day:1)));return o}
function calc(sp,m){
 const n=dim(m),tk=CUR,cut=m<tk?n:m>tk?0:new Date().getDate(),P=M(m).paid;
 const days=Array.from({length:n},(_,i)=>({d:i+1,ev:[],out:0,go:0,v:0})),cats={},add=(c,v)=>cats[c]=(cats[c]||0)+v;
 const fixed=[],budgets=[],anns=[];let bal=0;
 D.items.filter(i=>i.space===sp).forEach(it=>{const r=R(it,m);if(!r)return;
  if(it.kind==="fixed")occ(it,r,m).forEach(o=>{const real=P[o.key],paid=real!==undefined,row={...o,it,planned:r.amount,paid,real:paid?real:r.amount},dd=days[o.day-1];fixed.push(row);dd.ev.push(row);if(paid){dd.out+=real;bal+=r.amount-real}else dd.go+=r.amount;add(it.categoryId,row.real)});
  else if(it.kind==="budget"){const es=D.entries.filter(e=>e.space===sp&&e.categoryId===it.categoryId&&e.date.startsWith(m)),spent=sum(es),b=r.amount;budgets.push({it,es,spent,budget:b});bal+=b-spent;add(it.categoryId,Math.max(b,spent));
   if(cut<n){const s=Math.max(0,b-spent)/(n-cut);for(let d=cut;d<n;d++){days[d].go+=s;days[d].v+=s}}}
  else anns.push({it,r})});
 const bc=new Set(budgets.map(b=>b.it.categoryId)),oneoffs=D.entries.filter(e=>e.space===sp&&e.date.startsWith(m)&&!bc.has(e.categoryId));
 budgets.forEach(b=>b.es.forEach(e=>days[+e.date.slice(8)-1].out+=+e.amount));
 oneoffs.forEach(e=>{days[+e.date.slice(8)-1].out+=+e.amount;add(e.categoryId,+e.amount)});
 const resAmt=anns.reduce((s,a)=>s+a.r.amount*a.r.months.length/12,0),rd=Math.min(n,D.settings.reserveDay[sp]||5),done=!!M(m).reserve[sp];
 anns.forEach(a=>add(a.it.categoryId,a.r.amount*a.r.months.length/12));
 if(resAmt>0)done?days[rd-1].out+=resAmt:days[rd-1].go+=resAmt;
 const out=days.reduce((s,d)=>s+d.out,0),go=days.reduce((s,d)=>s+d.go,0),income=sp==="familia"?sum(M(m).income):0;
 return{n,cut,days,cats,fixed,budgets,anns,oneoffs,resAmt,rd,done,out,go,exp:out+go,income,bal}}
/* charts */
function chart(xmax,ymax,lines,h=190){const w=640,L=44,B=22,T=8,x=v=>L+v/xmax*(w-L-8),y=v=>T+(h-T-B)*(1-v/(ymax||1));
 const p=lines.map(l=>l.p.length?`<polyline fill="none" stroke="${l.c}" stroke-width="2" ${l.d?'stroke-dasharray="5 4"':""} points="${l.p.map(q=>x(q[0])+","+y(q[1])).join(" ")}"/>`:"").join("");
 return`<svg viewBox="0 0 ${w} ${h}" width="100%"><line x1="${L}" x2="${w-8}" y1="${y(0)}" y2="${y(0)}" stroke="#D6CCAE"/><line x1="${L}" x2="${L}" y1="${T}" y2="${y(0)}" stroke="#D6CCAE"/><text x="${L-4}" y="${T+8}" font-size="10" text-anchor="end" fill="#5B6152">${Math.round(ymax)}€</text><text x="${L}" y="${h-6}" font-size="10" fill="#5B6152">1</text><text x="${w-8}" y="${h-6}" font-size="10" text-anchor="end" fill="#5B6152">${xmax}</text>${p}</svg>`}
function donut(data){const r=70,c=2*Math.PI*r,tot=data.reduce((s,d)=>s+d.value,0)||1;let o=0;
 return`<svg viewBox="0 0 180 180" width="170" height="170">${data.map(d=>{const l=d.value/tot*c,s=`<circle cx="90" cy="90" r="${r}" fill="none" stroke="${d.color}" stroke-width="22" stroke-dasharray="${l} ${c-l}" stroke-dashoffset="${-o}" transform="rotate(-90 90 90)"/>`;o+=l;return s}).join("")}</svg>`}
/* ui helpers */
const catOpts=sel=>[...D.categories,NOC].map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.name)}</option>`).join("");
const stat=(l,v,cls="",hl="")=>`<div class="card ${hl}"><div class="lab">${l}</div><div class="val mono ${cls}">${v}</div></div>`;
const sgn=v=>v>=0?"pos":"neg";
function hdr(t,{space,year}={}){return`<div class="row"><h1 class="serif">${t}</h1><div class="grp">
 ${space?`<div class="seg">${SP.map(s=>`<button class="${U.space===s[0]?"on":""}" data-a="space" data-v="${s[0]}">${s[1]}</button>`).join("")}</div>`:""}
 <button class="icon-btn" data-a="nav-m" data-v="${year?-12:-1}">←</button><span class="mono" style="min-width:${year?60:150}px;text-align:center">${year?U.month.slice(0,4):mlabel(U.month)}</span><button class="icon-btn" data-a="nav-m" data-v="${year?12:1}">→</button></div></div>`}
function pie(c){const d=Object.entries(c.cats).map(([id,v])=>({name:cat(id).name,value:v,color:cat(id).color})).filter(x=>x.value>.004).sort((a,b)=>b.value-a.value);
 return d.length?donut(d)+d.map(x=>`<div class="leg"><span><span class="dot" style="background:${x.color}"></span>${esc(x.name)}</span><span class="mono">${eur(x.value)}</span></div>`).join(""):`<div class="empty">Sem despesas neste mês.</div>`}
/* pages */
function pOverview(){const m=U.month,cs=SP.map(s=>calc(s[0],m)),T=k=>cs[0][k]+cs[1][k];
 return hdr("Visão geral")+`<div class="stats">${stat("Saída prevista (total)",eur(T("exp")),"","hl")}${stat("Já saiu",eur(T("out")))}${stat("Por sair",eur(T("go")))}</div>
 <div class="cols">${SP.map((s,i)=>{const c=cs[i];return`<div><h2 class="serif" style="font-size:19px;margin-top:0">${s[1]}</h2><div class="stats">${stat("Saída prevista",eur(c.exp))}${stat("Já saiu",eur(c.out))}${stat("Por sair",eur(c.go))}
 ${i===0?stat("Rendimentos",eur(c.income))+stat("Folga prevista",eur(c.income-c.exp),sgn(c.income-c.exp))+stat("Folga concretizada",eur(c.income-c.out),sgn(c.income-c.out)):""}
 ${stat("Balanço do mês",eur(c.bal),sgn(c.bal))}</div>${pie(c)}</div>`}).join("")}</div>
 ${D.items.length?"":`<div class="empty" style="margin-top:20px">Sem dados. Usa "Importar JSON" no menu lateral.</div>`}`}
function entryForm(id,cid){const m=U.month,d=m===CUR?new Date().toISOString().slice(0,10):m+"-01";
 return`<div class="grp" style="flex-wrap:wrap;margin:8px 0">${cid?"":`<select id="ec-${id}">${catOpts()}</select>`}<input type="number" step="0.01" id="ea-${id}" placeholder="Valor" style="width:100px"><input type="date" id="ed-${id}" value="${d}" min="${m}-01" max="${m}-${dim(m)}"><input id="en-${id}" placeholder="Nota" style="width:200px"><button class="btn" data-a="add-entry" data-id="${id}" data-cat="${cid||""}">+ Registo</button></div>`}
function entryRows(es){return es.length?`<table>${es.sort((a,b)=>a.date<b.date?-1:1).map(e=>`<tr><td style="width:105px">${e.date.slice(8)}/${e.date.slice(5,7)}</td><td>${esc(cat(e.categoryId).name)}</td><td><input data-c="en" data-id="${e.id}" data-f="note" value="${esc(e.note||"")}"></td><td style="width:100px"><input class="mono" type="number" step="0.01" data-c="en" data-id="${e.id}" data-f="amount" data-n="1" value="${e.amount}"></td><td style="width:40px"><button class="icon-btn danger" data-a="del-entry" data-id="${e.id}">✕</button></td></tr>`).join("")}</table>`:""}
function budCard(b,c){const{n,cut}=c,by=Array(n+1).fill(0);b.es.forEach(e=>by[+e.date.slice(8)]+=+e.amount);
 let cum=0;const real=cut?[[0,0],...Array.from({length:cut},(_,i)=>[i+1,cum+=by[i+1]])]:[],proj=cut?b.spent/cut*n:b.budget,over=proj>b.budget+.005;
 const lines=[{p:[[0,0],[n,b.budget]],c:"#9A9484"},{p:real,c:"#2F6F4F"},{p:cut&&cut<n?[[cut,b.spent],[n,proj]]:[],c:over?"#B4533C":"#C08A2E",d:1}];
 return`<div class="bud"><div class="row" style="margin:0 0 6px"><b>${esc(cat(b.it.categoryId).name)}</b><span class="mono">${eur(b.spent)} / ${eur(b.budget)}</span></div>${chart(n,Math.max(b.budget,proj,b.spent)*1.05,lines,150)}
 <div class="hint">${cut?`Média ${eur(b.spent/cut)}/dia · projeção <b class="${over?"neg":"pos"}">${eur(proj)}</b> ${over?`(${eur(proj-b.budget)} acima do orçamento)`:"(dentro do orçamento)"}`:"Mês por começar."} Linha cinzenta = ritmo esperado; tracejada = projeção.</div>${entryForm(b.it.id,b.it.categoryId)}${entryRows(b.es)}</div>`}
function pMonth(){const sp=U.space,m=U.month,c=calc(sp,m),{n,cut}=c;let a=0,r=0;const ce=[],cr=[];c.days.forEach((d,i)=>{a+=d.out+d.go;ce.push([i+1,a]);if(i<cut){r+=d.out;cr.push([i+1,r])}});
 const inc=M(m).income;let cu=0;
 return hdr("Mês",{space:1})+`<div class="stats">${stat("Saída prevista",eur(c.exp),"","hl")}${stat("Já saiu",eur(c.out))}${stat("Por sair",eur(c.go))}${sp==="familia"?stat("Rendimentos",eur(c.income))+stat("Folga prevista",eur(c.income-c.exp),sgn(c.income-c.exp))+stat("Folga concretizada",eur(c.income-c.out),sgn(c.income-c.out)):""}${stat("Balanço",eur(c.bal),sgn(c.bal))}</div>
 ${sp==="familia"?`<h2>Rendimentos do mês</h2><table>${inc.map(x=>`<tr><td><input data-c="inc" data-id="${x.id}" data-f="name" value="${esc(x.name)}"></td><td style="width:130px"><input class="mono" type="number" step="0.01" data-c="inc" data-id="${x.id}" data-f="amount" data-n="1" value="${x.amount}"></td><td style="width:40px"><button class="icon-btn danger" data-a="del-inc" data-id="${x.id}">✕</button></td></tr>`).join("")}</table><button class="btn" style="margin-top:8px" data-a="add-inc">+ Rendimento</button>`:""}
 <h2>Evolução da saída acumulada</h2>${chart(n,Math.max(a,1)*1.05,[{p:[[0,0],...ce],c:"#C08A2E"},{p:cr.length?[[0,0],...cr]:[],c:"#2F6F4F"}])}<div class="hint"><span class="dot" style="background:#C08A2E"></span>Previsto <span class="dot" style="background:#2F6F4F;margin-left:12px"></span>Real</div>
 <h2>Mapa por dia</h2><table><tr><th>Dia</th><th>Despesas fixas e reserva</th><th>Variável est.</th><th>Saiu</th><th>Por sair</th><th>Acum. previsto</th></tr>${c.days.map(d=>{cu+=d.out+d.go;const ev=d.ev.map(e=>`${esc(e.it.name)} ${eur(e.real)}${e.paid?" ✓":""}`);if(d.d===c.rd&&c.resAmt>0)ev.push(`Reserva anual ${eur(c.resAmt)}${c.done?" ✓":""}`);
  const late=d.d<=cut&&(d.ev.some(e=>!e.paid)||(d.d===c.rd&&c.resAmt>0&&!c.done));return`<tr class="${m===CUR&&d.d===cut?"today":late?"late":""}"><td class="mono">${d.d}</td><td>${ev.join(" · ")}</td><td class="mono">${d.v?eur(d.v):""}</td><td class="mono">${d.out?eur(d.out):""}</td><td class="mono">${d.go?eur(d.go):""}</td><td class="mono">${eur(cu)}</td></tr>`}).join("")}</table><div class="hint">Linhas a vermelho: vencimento passado sem pagamento. O orçamento variável por gastar reparte-se pelos dias que faltam.</div>
 <h2>Despesas fixas — marcar como pagas</h2>${c.fixed.length||c.resAmt?`<table><tr><th>Dia</th><th>Despesa</th><th>Categoria</th><th>Previsto</th><th>Pago</th><th>Valor real</th></tr>
 ${c.fixed.map(f=>`<tr><td class="mono">${f.day}</td><td>${esc(f.it.name)}</td><td>${esc(cat(f.it.categoryId).name)}</td><td class="mono">${eur(f.planned)}</td><td><input type="checkbox" data-c="paid" data-key="${f.key}" data-p="${f.planned}" ${f.paid?"checked":""}></td><td><input class="mono" type="number" step="0.01" data-c="real" data-key="${f.key}" value="${f.paid?f.real:""}" ${f.paid?"":"disabled"}></td></tr>`).join("")}
 ${c.resAmt>0?`<tr><td class="mono">${c.rd}</td><td><b>Reserva anual transferida</b></td><td>—</td><td class="mono">${eur(c.resAmt)}</td><td><input type="checkbox" data-c="res" ${c.done?"checked":""}></td><td></td></tr>`:""}</table>`:`<div class="empty">Sem despesas fixas neste mês.</div>`}
 <h2>Orçamentos variáveis</h2>${c.budgets.map(b=>budCard(b,c)).join("")||`<div class="empty">Sem orçamentos. Cria-os em Modelos.</div>`}
 <h2>Despesas pontuais / extras</h2><div class="hint">Em categorias com orçamento consomem-no; nas restantes somam ao previsto do mês.</div>${entryForm("x",null)}${entryRows(c.oneoffs)}`}
function pModels(){const sp=U.space,m=U.month,rows=D.items.filter(i=>i.space===sp).map(i=>({i,r:R(i,m)})).filter(x=>x.r);
 const ci=(i,f,extra="")=>`data-c="it" data-id="${i.id}" data-f="${f}" ${extra}`,vi=(i,f,t)=>ci(i,f,`data-v="1" ${t?'data-n="1"':""}`);
 const of=k=>rows.filter(x=>x.i.kind===k),del=i=>`<td style="width:40px"><button class="icon-btn danger" data-a="del-item" data-id="${i.id}">✕</button></td>`,nm=i=>`<td><input ${ci(i,"name")} value="${esc(i.name)}"></td>`,ct=i=>`<td><select ${ci(i,"categoryId")}>${catOpts(i.categoryId)}</select></td>`,am=(i,r,l="")=>`<td style="width:110px"><input class="mono" type="number" step="0.01" ${vi(i,"amount",1)} value="${r.amount}" ${l}></td>`;
 return hdr("Modelos",{space:1})+`<div class="row"><div class="grp">As alterações aplicam-se: <select data-c="scope"><option value="fwd" ${U.scope==="fwd"?"selected":""}>a este mês e seguintes</option><option value="once" ${U.scope==="once"?"selected":""}>só a este mês</option></select></div>
 <div class="grp">Dia da transferência da reserva anual: <input type="number" min="1" max="28" style="width:60px" data-c="resday" value="${D.settings.reserveDay[sp]}"></div></div><div class="hint">Os meses anteriores nunca são alterados. Valores mostrados para ${mlabel(m)}. Eliminar remove a despesa a partir deste mês.</div>
 <h2>Despesas fixas</h2><table><tr><th>Nome</th><th>Categoria</th><th>Frequência</th><th>Dia / data de referência</th><th>Valor</th><th></th></tr>${of("fixed").map(({i,r})=>`<tr>${nm(i)}${ct(i)}<td><select ${vi(i,"freq")}><option value="monthly" ${r.freq!=="biweekly"?"selected":""}>Mensal</option><option value="biweekly" ${r.freq==="biweekly"?"selected":""}>A cada 14 dias</option></select></td><td>${r.freq==="biweekly"?`<input type="date" ${vi(i,"ref")} value="${r.ref}">`:`<input type="number" min="1" max="31" ${vi(i,"day",1)} value="${r.day}">`}</td>${am(i,r)}${del(i)}</tr>`).join("")}</table><button class="btn" style="margin-top:8px" data-a="add-item" data-k="fixed">+ Despesa fixa</button>
 <h2>Orçamentos variáveis (por categoria)</h2><table><tr><th>Categoria</th><th>Orçamento mensal</th><th></th></tr>${of("budget").map(({i,r})=>`<tr>${ct(i)}${am(i,r)}${del(i)}</tr>`).join("")}</table><button class="btn" style="margin-top:8px" data-a="add-item" data-k="budget">+ Orçamento</button>
 <h2>Despesas anuais</h2><table><tr><th>Nome</th><th>Categoria</th><th>Valor por pagamento</th><th>Meses de pagamento</th><th>Total anual</th><th>Reserva / mês</th><th></th></tr>${of("annual").map(({i,r})=>`<tr>${nm(i)}${ct(i)}${am(i,r)}<td><div class="mo">${[...MI].map((l,k)=>`<label>${l}<input type="checkbox" data-c="mon" data-id="${i.id}" data-mo="${k+1}" ${r.months.includes(k+1)?"checked":""}></label>`).join("")}</div></td><td class="mono">${eur(r.amount*r.months.length)}</td><td class="mono pos">${eur(r.amount*r.months.length/12)}</td>${del(i)}</tr>`).join("")}</table><button class="btn" style="margin-top:8px" data-a="add-item" data-k="annual">+ Despesa anual</button><div class="hint" style="margin-top:6px">Cada despesa anual tem de ter pelo menos um mês. Total anual = valor × meses marcados; a reserva mensal é esse total ÷ 12.</div>`}
function pAnnual(){const sp=U.space,y=U.month.slice(0,4);let tot=0;
 const rows=Array.from({length:12},(_,k)=>{const m=`${y}-${pad(k+1)}`,l=[];D.items.filter(i=>i.space===sp&&i.kind==="annual").forEach(i=>{const r=R(i,m);if(r&&r.months.includes(k+1))l.push({n:i.name,v:r.amount})});const t=sum(l.map(x=>({amount:x.v})));tot+=t;return{m,l,t}});
 const res=D.items.filter(i=>i.space===sp&&i.kind==="annual").reduce((s,i)=>{const r=R(i,U.month);return s+(r?r.amount*r.months.length/12:0)},0);
 return hdr("Mapa anual",{space:1,year:1})+`<div class="stats">${stat("Total a pagar no ano",eur(tot),"","hl")}${stat("Reserva mensal ("+mlabel(U.month)+")",eur(res))}</div><table><tr><th>Mês</th><th>Pagamentos</th><th>A pagar</th></tr>${rows.map(x=>`<tr><td>${mlabel(x.m).split(" ")[0]}</td><td>${x.l.map(e=>`${esc(e.n)} <span class="mono">${eur(e.v)}</span>`).join(" · ")||'<span class="hint">—</span>'}</td><td class="mono">${x.t?eur(x.t):""}</td></tr>`).join("")}</table><div class="hint" style="margin-top:8px">O dinheiro já está reservado através da transferência mensal; isto é só a visão de quando cada pagamento sai.</div>`}
function pCats(){return`<div class="row"><h1 class="serif">Categorias</h1><button class="btn" data-a="add-cat">+ Nova categoria</button></div><table><tr><th style="width:60px">Cor</th><th>Nome</th><th></th></tr>${D.categories.map(c=>`<tr><td><input type="color" data-c="cat" data-id="${c.id}" data-f="color" value="${c.color}"></td><td><input data-c="cat" data-id="${c.id}" data-f="name" value="${esc(c.name)}"></td><td style="width:40px"><button class="icon-btn danger" data-a="del-cat" data-id="${c.id}">✕</button></td></tr>`).join("")}</table><div class="hint" style="margin-top:8px">Ao eliminar, as despesas associadas passam a "Sem categoria".</div>`}
function render(){const N=[["overview","Visão geral"],["month","Mês"],["models","Modelos"],["annual","Mapa anual"],["cats","Categorias"]],f={overview:pOverview,month:pMonth,models:pModels,annual:pAnnual,cats:pCats}[U.page],sc=document.querySelector("main")?.scrollTop||0;
 document.getElementById("app").innerHTML=`<aside><div class="serif" style="font-size:20px;font-weight:600">Livro de Contas</div><div class="hint">Família e Trabalho</div><nav>${N.map(n=>`<button class="nav-btn ${U.page===n[0]?"active":""}" data-a="page" data-v="${n[0]}">${n[1]}</button>`).join("")}</nav><div class="side"><button class="side-btn" data-a="export">⭳ Exportar JSON</button><button class="side-btn" data-a="import">⭱ Importar JSON</button><input type="file" id="imp" accept="application/json" class="hidden"></div></aside><main><div class="content">${f()}</div></main>${U.banner?`<div class="banner" style="background:${U.banner[0]?"var(--brick)":"var(--acc)"}">${esc(U.banner[1])}</div>`:""}`;
 document.querySelector("main").scrollTop=sc}
function banner(err,t){U.banner=[err,t];render();setTimeout(()=>{U.banner=null;render()},3200)}
/* mutations */
function edit(id,patch){const it=D.items.find(x=>x.id===id),m=U.month;
 if(U.scope==="once"){const o=MM(m).ov;o[id]={...(o[id]||{}),...patch};return}
 it.versions=it.versions.filter(v=>v.from<=m);let v=it.versions.find(v=>v.from===m);if(!v){v={...R0(it,m),from:m};it.versions.push(v)}Object.assign(v,patch);
 const o=M(m).ov[id];if(o)Object.keys(patch).forEach(k=>delete o[k])}
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,id=el.dataset.id,m=U.month;
 if(a==="page")U.page=el.dataset.v;else if(a==="space")U.space=el.dataset.v;else if(a==="nav-m")U.month=addM(m,+el.dataset.v);
 else if(a==="export")return exportData();else if(a==="import")return document.getElementById("imp").click();
 else if(a==="add-inc")MM(m).income.push({id:uid(),name:"Fonte",amount:0});
 else if(a==="del-inc")MM(m).income=M(m).income.filter(x=>x.id!==id);
 else if(a==="add-entry"){const g=k=>document.getElementById(k+"-"+id),amt=parseFloat(g("ea").value);if(!amt)return;D.entries.push({id:uid(),space:U.space,categoryId:el.dataset.cat||g("ec").value,date:g("ed").value||m+"-01",amount:amt,note:g("en").value})}
 else if(a==="del-entry")D.entries=D.entries.filter(x=>x.id!==id);
 else if(a==="add-item"){const k=el.dataset.k,used=D.items.filter(i=>i.space===U.space&&i.kind==="budget").map(i=>i.categoryId),c=(k==="budget"?D.categories.find(c=>!used.includes(c.id)):D.categories[0])||NOC;
  D.items.push({id:uid(),space:U.space,kind:k,name:"Nova despesa",categoryId:c.id,tag:"essencial",versions:[{from:m,amount:0,...(k==="fixed"?{freq:"monthly",day:1,ref:m+"-01"}:{}),...(k==="annual"?{months:[1]}:{})}]})}
 else if(a==="del-item"){const it=D.items.find(x=>x.id===id);it.versions=it.versions.filter(v=>v.from<m);if(it.versions.length)it.versions.push({from:m,end:true});else D.items=D.items.filter(x=>x!==it)}
 else if(a==="add-cat")D.categories.push({id:uid(),name:"Nova categoria",color:"#"+Math.floor(Math.random()*0x888888+0x444444).toString(16)});
 else if(a==="del-cat"){D.categories=D.categories.filter(c=>c.id!==id);D.items.forEach(i=>i.categoryId===id&&(i.categoryId=NOC.id));D.entries.forEach(i=>i.categoryId===id&&(i.categoryId=NOC.id))}
 render()});
document.addEventListener("change",e=>{const el=e.target,c=el.dataset.c,id=el.dataset.id,m=U.month;
 if(el.id==="imp")return importData(el);if(!c)return;const val=el.dataset.n?parseFloat(el.value)||0:el.value;
 if(c==="scope")U.scope=el.value;else if(c==="resday")D.settings.reserveDay[U.space]=Math.min(28,Math.max(1,+el.value||5));
 else if(c==="paid"){const P=MM(m).paid;el.checked?P[el.dataset.key]=+el.dataset.p:delete P[el.dataset.key]}
 else if(c==="real")MM(m).paid[el.dataset.key]=parseFloat(el.value)||0;
 else if(c==="res")MM(m).reserve[U.space]=el.checked;
 else if(c==="inc")MM(m).income.find(x=>x.id===id)[el.dataset.f]=val;
 else if(c==="en")D.entries.find(x=>x.id===id)[el.dataset.f]=val;
 else if(c==="cat")D.categories.find(x=>x.id===id)[el.dataset.f]=val;
 else if(c==="it"){const it=D.items.find(x=>x.id===id),f=el.dataset.f;if(el.dataset.v){const p={[f]:val};if(f==="freq"){p.ref=R(it,m).ref||m+"-01";p.day=R(it,m).day||1}edit(id,p)}else it[f]=val}
 else if(c==="mon"){const r=R(D.items.find(x=>x.id===id),m),k=+el.dataset.mo,ms=el.checked?[...new Set([...r.months,k])].sort((a,b)=>a-b):r.months.filter(x=>x!==k);if(!ms.length)return banner(1,"Cada despesa anual precisa de pelo menos um mês.");edit(id,{months:ms})}
 render()});
function exportData(){const b=new Blob([JSON.stringify({...D,exportedAt:new Date().toISOString()},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`orcamento-familiar-${CUR}.json`;document.body.appendChild(a);a.click();a.remove();banner(0,"Dados exportados.")}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!["categories","items","entries"].every(k=>Array.isArray(d[k])))throw 0;D={months:{},settings:{reserveDay:{familia:5,trabalho:5}},...d};banner(0,"Dados importados.")}catch(x){banner(1,"Ficheiro inválido: usa um JSON no novo formato (versão 2).")}};r.readAsText(f);inp.value=""}
render();
</script></body></html>
